<!DOCTYPE html>
<html lang="en">
<head>
  <title>Car Insurance Registration Form</title>
</head>
<body>

  <h2>Car Insurance Registration</h2>

  <form method="POST">

    <label for="name">Name</label><br>
    <input type="text" id="name" required /><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" required /><br><br>

    <label>Gender</label><br>
    <input type="radio" id="gender_m" name="gender" required />
    <label for="gender_m">Male</label>
    <input type="radio" id="gender_f" name="gender" />
    <label for="gender_f">Female</label><br><br>

    <label for="cars">Car Brands</label><br>
    <select id="cars">
      <option value="">--Please choose an option--</option>
      <option value="bmw">BMW</option>
      <option value="audi">Audi</option>
      <option value="mercedez">Mercedez</option>
    </select><br><br>

    <label for="carage">Car Age</label><br>
    <input type="number" id="carage" required /><br><br>

    <label for="dop">Date of Purchase</label><br>
    <input type="date" id="dop" required /><br><br>

    <label for="password">Password</label><br>
    <input type="password" id="password" required /><br><br>

    <button type="submit">Submit</button>

  </form>

</body>
</html>
